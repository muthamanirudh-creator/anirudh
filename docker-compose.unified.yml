services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: govcareer
      POSTGRES_PASSWORD: govcareer
      POSTGRES_DB: govcareer
    volumes:
      - govcareer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govcareer -d govcareer"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CAMPUS_PORT: 3101
      DATABASE_URL: postgres://govcareer:govcareer@postgres:5432/govcareer
      DB_CONNECTION_TIMEOUT_MS: 3000
      AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  govcareer_pg:
